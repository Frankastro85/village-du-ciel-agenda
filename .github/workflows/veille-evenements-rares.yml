name: Agenda Astro - Veille du club (occultations majeures et cometes m<10)

on:
  schedule:
    - cron: '41 8 * * 2' # Chaque mardi 08:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: agenda-astro-veille-club
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Charger le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tester les criteres du club
        run: node tests/verifier-veille-rares.mjs

      - name: Rechercher uniquement les occultations majeures et cometes de magnitude inferieure a 10
        run: node scripts/veille-evenements-rares.mjs

      - name: Verifier les filtres avant publication du rapport
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("docs/veille-evenements-rares.json","utf8"));
          if(d.schema!==1||!Array.isArray(d.candidates)||!d.sources?.some(s=>s.ok))process.exit(1);
          if(d.candidates.some(c=>c.validation!=="unverified" ||
            (c.type==="comete" && !(Number.isFinite(c.sourceData?.magnitude)&&c.sourceData.magnitude<10)) ||
            (c.type==="occultation" && c.sourceData?.importance!=="majeure") ||
            !["comete","occultation"].includes(c.type)))process.exit(1);
          console.log(d.counts);
          '

      - name: Archiver le rapport de veille (ne modifie pas le panneau FTP)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/veille-evenements-rares.json
          if git diff --cached --quiet; then
            echo 'Aucun changement dans le rapport.'
          else
            git commit -m 'astro: veille club magnitude inferieure a 10 et occultations majeures'
            git push
          fi

      - name: Mettre a jour les alertes du club dans Issues
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('docs/veille-evenements-rares.json','utf8'));
            const {owner,repo}=context.repo;
            const today=d.generatedAt.slice(0,10);
            const month=today.slice(0,7);
            // Conserver le titre de la revue precedente pour mettre à jour sans doublon.
            const title=`Agenda Astro — phénomènes rares à contrôler — ${month}`;
            const safe=s=>String(s??'').replace(/[\r\n|<>\[\]]/g,' ').slice(0,230);
            const url=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.toString():'';}catch{return '';}};
            const active=d.candidates.filter(c=>c.lastSeen===today);
            const candidateLine=c=>{
              const mag=c.type==='comete'?` · magnitude ${Number(c.sourceData.magnitude).toFixed(2)}`:'';
              return `- **${safe(c.title)}**${mag} · ${safe(c.observedDate)} — ${safe(c.summary)}${url(c.sourceUrl)?` — [Source](${url(c.sourceUrl)})`:''}`;
            };
            const sources=d.sources.map(s=>`- ${safe(s.source)} ${safe(s.date||s.year||'')} : ${s.ok?'OK':'indisponible'}`).join('\n');
            const body=`## Veille astronomique du club — ${month}\n\n`+
              `**Règles :** occultations de planètes brillantes ou d'étoiles remarquables (magnitude ≤ 2), comètes de magnitude estimée **strictement inférieure à 10**.\n\n`+
              `**${active.length} candidat(s) détecté(s) lors de cette exécution ; ${d.counts.newDetected} nouveau(x).**\n\n`+
              `${active.map(candidateLine).join('\n')||'Aucun événement répondant aux critères cette semaine.'}\n\n`+
              `### Sources\n${sources}\n\n`+
              `**Précaution :** visibilité depuis Les Herbiers non automatiquement validée ; magnitude cométaire prévisionnelle. Vérifier avant diffusion auprès du public.\n`+
              `Les voyages pour les éclipses restent dans le panneau séparé « Grands rendez-vous astro ailleurs ».\n`+
              `Rapport complet : \`docs/veille-evenements-rares.json\`. Aucun événement de cette veille n'est ajouté au panneau ni envoyé sur Discord.`;
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'all',per_page:100});
            const issue=issues.find(x=>!x.pull_request&&x.title===title);
            let number;
            if(issue){
              await github.rest.issues.update({owner,repo,issue_number:issue.number,body});number=issue.number;
            }else{
              const created=await github.rest.issues.create({owner,repo,title,body});number=created.data.number;
            }
            const newCandidates=d.candidates.filter(c=>d.newIds.includes(c.id) && c.lastSeen===today);
            if(newCandidates.length && issue){
              const comment=`**${newCandidates.length} nouvelle(s) piste(s) répondant aux critères du club**\n\n`+
                newCandidates.map(candidateLine).join('\n')+'\n\nÀ vérifier avant annonce aux membres.';
              await github.rest.issues.createComment({owner,repo,issue_number:number,body:comment});
            }
            core.info(`Revue #${number} actualisée ; ${newCandidates.length} nouveau(x) signalé(s).`);
